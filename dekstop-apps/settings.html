<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950 text-slate-100 font-sans select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Target Server URL - DMS Desktop Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { fontFamily: 'Inter', sans-serif; }
        .font-mono { fontFamily: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 p-4 flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3.5 shadow flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="p-1.5 bg-amber-500/20 text-amber-400 rounded-lg border border-amber-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </span>
            <div>
                <h1 class="text-xs font-bold text-white uppercase tracking-wider">Pengaturan Target Server URL</h1>
                <p class="text-[10px] text-slate-400">Konfigurasi Alamat Host & Port Aplikasi Backend</p>
            </div>
        </div>
        <span class="text-[10px] font-mono px-2 py-0.5 bg-slate-800 text-amber-400 rounded border border-slate-700">Desktop v1.0</span>
    </div>

    <!-- Form Area -->
    <div class="my-3 space-y-3 bg-slate-900/60 border border-slate-800/80 rounded-xl p-4 shadow-inner">
        <div>
            <label for="serverUrl" class="block text-xs font-bold font-mono text-slate-300 mb-1.5 flex justify-between">
                <span>TARGET URL SERVER:</span>
                <span class="text-[10px] text-amber-400">(http:// atau https://)</span>
            </label>
            <input 
                type="text" 
                id="serverUrl" 
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono font-semibold text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition" 
                placeholder="http://127.0.0.1:8000"
                autofocus
            >
        </div>

        <!-- Quick Presets -->
        <div>
            <span class="block text-[10px] font-mono font-bold text-slate-400 uppercase tracking-wider mb-1.5">Pintasan Preset URL:</span>
            <div class="grid grid-cols-3 gap-1.5 font-mono text-[10px]">
                <button type="button" onclick="setPreset('http://127.0.0.1:8000')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 font-bold transition text-center truncate">
                    127.0.0.1:8000
                </button>
                <button type="button" onclick="setPreset('http://localhost:8000')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 font-bold transition text-center truncate">
                    localhost:8000
                </button>
                <button type="button" onclick="setPreset('http://192.168.6.138:8000')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-slate-300 font-bold transition text-center truncate">
                    192.168.6.138:8000
                </button>
            </div>
        </div>

        <!-- Test Connection Feedback -->
        <div id="statusBox" class="p-2 rounded border text-[11px] font-mono hidden flex items-center gap-2">
            <span id="statusIcon"></span>
            <span id="statusText"></span>
        </div>
    </div>

    <!-- Footer Actions -->
    <div class="flex items-center justify-between border-t border-slate-800 pt-3">
        <button type="button" onclick="testConnection()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg text-xs font-mono font-bold transition flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <span>Test URL</span>
        </button>

        <div class="flex items-center gap-2 font-mono">
            <button type="button" onclick="closeWindow()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg text-xs font-bold transition">
                Batal (Esc)
            </button>

            <button type="button" onclick="saveSettings()" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-lg text-xs font-black transition shadow-lg flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                <span>Simpan & Reload</span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.desktopApi) {
                const config = await window.desktopApi.getConfig();
                if (config && config.server_config && config.server_config.target_url) {
                    document.getElementById('serverUrl').value = config.server_config.target_url;
                }
            } else {
                document.getElementById('serverUrl').value = 'http://127.0.0.1:8000';
            }
        });

        function setPreset(url) {
            document.getElementById('serverUrl').value = url;
        }

        async function testConnection() {
            const url = document.getElementById('serverUrl').value.trim();
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');

            if (!url) {
                alert('Masukkan Target URL terlebih dahulu!');
                return;
            }

            statusBox.classList.remove('hidden', 'bg-emerald-500/20', 'border-emerald-500/50', 'text-emerald-300', 'bg-rose-500/20', 'border-rose-500/50', 'text-rose-300');
            statusBox.classList.add('bg-blue-500/20', 'border-blue-500/50', 'text-blue-300');
            statusText.textContent = 'Mencoba koneksi ke ' + url + '...';
            statusIcon.innerHTML = '⏳';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const resp = await fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal });
                clearTimeout(timeoutId);

                statusBox.classList.remove('bg-blue-500/20', 'border-blue-500/50', 'text-blue-300');
                statusBox.classList.add('bg-emerald-500/20', 'border-emerald-500/50', 'text-emerald-300');
                statusText.textContent = 'Koneksi Berhasil OK! Server siap dijangkau.';
                statusIcon.innerHTML = '🟢';
            } catch (err) {
                statusBox.classList.remove('bg-blue-500/20', 'border-blue-500/50', 'text-blue-300');
                statusBox.classList.add('bg-rose-500/20', 'border-rose-500/50', 'text-rose-300');
                statusText.textContent = 'Gagal terhubung! Pastikan server aktif pada ' + url;
                statusIcon.innerHTML = '🔴';
            }
        }

        async function saveSettings() {
            let url = document.getElementById('serverUrl').value.trim();
            if (!url) {
                alert('Target URL tidak boleh kosong!');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'http://' + url;
            }

            if (window.desktopApi) {
                await window.desktopApi.saveConfig(url);
                window.close();
            } else {
                window.location.href = url;
            }
        }

        function closeWindow() {
            if (window.desktopApi && window.desktopApi.closeSettingsWindow) {
                window.desktopApi.closeSettingsWindow();
            } else {
                window.close();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveSettings();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeWindow();
            }
        });
    </script>
</body>
</html>
